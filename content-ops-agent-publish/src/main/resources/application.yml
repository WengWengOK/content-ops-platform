server:
  port: 8084
  servlet:
    context-path: /publish-agent

spring:
  application:
    name: content-ops-agent-publish
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${LLM_MODEL:gpt-4o}
          temperature: 0.1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: publish-agent-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.contentops.*"

# LangChain4j OpenAI auto-configuration: creates the OpenAiChatModel (ChatModel) bean
# consumed by PublishAgentConfig to build the PublishingAgent AI Service.
langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model-name: ${LLM_MODEL:gpt-4o}
      temperature: 0.1
      log-requests: true
      log-responses: true

# Chat Memory configuration (P0: Agent Memory & Multi-turn Dialogue)
contentops:
  chat-memory:
    window-size: 20          # Max messages retained per conversation window
    ttl-hours: 24            # Redis TTL for chat memory entries
    key-prefix: "contentops:chat-memory:"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.contentops: DEBUG
    dev.langchain4j: INFO
