# ════════════════════════════════════════════════════════════════
# 生产环境配置 (Prod Profile)
# 启动方式: SPRING_PROFILES_ACTIVE=prod
# ════════════════════════════════════════════════════════════════

# 生产环境使用 INFO 级别日志
logging:
  level:
    com.contentops: INFO
    org.springframework.ai: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

# 生产环境健康检查不暴露详情
management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,prometheus
        exclude: info,metrics

# 生产环境数据库连接池配置
spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: contentops-hikari-prod
      leak-detection-threshold: 60000
  data:
    redis:
      password: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 5000ms
        shutdown-timeout: 200ms

# 生产环境关闭 Swagger UI
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
