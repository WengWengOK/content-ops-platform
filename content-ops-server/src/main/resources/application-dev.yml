# ════════════════════════════════════════════════════════════════
# 开发环境配置 (Dev Profile)
# 启动方式: SPRING_PROFILES_ACTIVE=dev （默认）
# ════════════════════════════════════════════════════════════════

# 开发环境开启 DEBUG 日志，便于调试
logging:
  level:
    com.contentops: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.web: DEBUG

# 开发环境暴露健康检查详情
management:
  endpoint:
    health:
      show-details: always

# 开发环境开启 Swagger UI
springdoc:
  swagger-ui:
    enabled: true

# 开发环境 Redis 无需密码
spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: contentops-hikari-dev
  data:
    redis:
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 30000ms
        shutdown-timeout: 200ms
