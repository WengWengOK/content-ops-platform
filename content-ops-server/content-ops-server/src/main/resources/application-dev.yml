# ════════════════════════════════════════════════════════════════
# 开发环境配置 (Dev Profile)
# 启动方式: SPRING_PROFILES_ACTIVE=dev （默认）
# ════════════════════════════════════════════════════════════════

# 开发环境开启 DEBUG 日志，便于调试
logging:
  level:
    com.contentops: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.web: DEBUG

# 开发环境暴露健康检查详情
management:
  endpoint:
    health:
      show-details: always

# 开发环境开启 Swagger UI
springdoc:
  swagger-ui:
    enabled: true

# 开发环境 DashScope 配置（继承 application.yml 中默认值，此处可按需覆盖）
# 若要在本地直接走 DashScope 调用：1) dashscope.enabled=true
# 2) 同步调整 contentops.model-routing.base-url/api-key/default-model 指向 DashScope
dashscope:
  enabled: false

# 平台发布 MCP：开发环境加一个"桩"通道，用 scripts/mcp-stub-server.py 冒烟验证发布链路
# （不连真实平台，默认关闭，用 CONTENTOPS_PUBLISH_STUB=true 打开）
contentops:
  publish:
    mcp:
      platforms:
        stub:
          enabled: ${CONTENTOPS_PUBLISH_STUB:false}
          transport: stdio
          command: ["python", "${CONTENTOPS_PUBLISH_STUB_SCRIPT:scripts/mcp-stub-server.py}"]
          work-dir: ${CONTENTOPS_REPO_ROOT:.}
          timeout-ms: 60000
          publish-tool: publish_note
          param-names:
            content: content
          note: 开发用桩服务，仅验证链路
        # 官方参考实现（@modelcontextprotocol/server-everything）：验证与第三方 MCP server 的真实互通
        # 用官方 filesystem server 做互通性验证：它能列出真实工具，
        # 且没有发布类工具，正好验证我们"未暴露发布工具"的守卫逻辑
        mcp-reference:
          enabled: ${CONTENTOPS_PUBLISH_REFERENCE:false}
          transport: stdio
          command: ["npx", "-y", "@modelcontextprotocol/server-filesystem", "${CONTENTOPS_REPO_ROOT:.}"]
          timeout-ms: 120000
          note: 官方文件系统 MCP server，用于互通性验证（无发布工具）
        # 影刀 RPA 通道联调（用桩 MCP server 模拟影刀官方工具：queryApplist / queryRobotParam / runApp / startJob / queryJob）
        # 真实环境把 command 换成 "npx -y yingdao-mcp-server" 并配 RPA_MODEL / SHADOWBOT_PATH 或 ACCESS_KEY_*
        yingdao:
          enabled: false
          channel: rpa
          rpa:
            enabled: ${CONTENTOPS_PUBLISH_RPA:false}
            command: ["python", "${CONTENTOPS_PUBLISH_RPA_SCRIPT:scripts/mcp-stub-server.py}"]
            work-dir: ${CONTENTOPS_REPO_ROOT:.}
            timeout-ms: 60000
            publish-tool: startJob
            status-tool: queryJob
            job-id-field: jobId
            poll-interval-ms: 300
            poll-timeout-ms: 20000
            param-names:
              content: content
            extra-params:
              appId: app-demo-001
            note: 影刀 RPA 联调桩（异步 startJob → queryJob 轮询）

# 开发环境 Redis 无需密码
spring:
  datasource:
    # P0-4：持久化切 PostgreSQL（专属本地实例端口 5433，数据目录 E:/JavaProjects/Contentops/.pgdata）。
    # 凭据与 content-ops-configs/.env 保持一致，生产环境用环境变量覆盖即可。
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/contentops}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:contentops}
    password: ${DATABASE_PASS:change-me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: contentops-hikari-dev
  data:
    redis:
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 30000ms
        shutdown-timeout: 200ms
