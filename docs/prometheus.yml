# P1: Prometheus 指标采集配置
# 采集编排器和所有 Agent 的 Micrometer 指标
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 编排器指标
  - job_name: 'orchestrator'
    metrics_path: '/orchestrator/actuator/prometheus'
    static_configs:
      - targets: ['orchestrator:8080']

  # Topic Agent 指标
  - job_name: 'agent-topic'
    metrics_path: '/topic-agent/actuator/prometheus'
    static_configs:
      - targets: ['agent-topic:8081']

  # Content Agent 指标
  - job_name: 'agent-content'
    metrics_path: '/content-agent/actuator/prometheus'
    static_configs:
      - targets: ['agent-content:8082']

  # Image Agent 指标
  - job_name: 'agent-image'
    metrics_path: '/image-agent/actuator/prometheus'
    static_configs:
      - targets: ['agent-image:8083']

  # Publish Agent 指标
  - job_name: 'agent-publish'
    metrics_path: '/publish-agent/actuator/prometheus'
    static_configs:
      - targets: ['agent-publish:8084']

  # Analysis Agent 指标
  - job_name: 'agent-analysis'
    metrics_path: '/analysis-agent/actuator/prometheus'
    static_configs:
      - targets: ['agent-analysis:8085']

  # Optimize Agent 指标
  - job_name: 'agent-optimize'
    metrics_path: '/optimize-agent/actuator/prometheus'
    static_configs:
      - targets: ['agent-optimize:8086']
