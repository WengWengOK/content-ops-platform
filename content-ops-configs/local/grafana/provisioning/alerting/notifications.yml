apiVersion: 1

contactPoints:
  - orgId: 1
    name: content-ops-alerts
    receivers:
      - uid: webhook-contentops
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://localhost:8080/api/v1/observability/alerts
          httpMethod: POST
          autoResolve: true

policies:
  - orgId: 1
    receiver: content-ops-alerts
    group_by: ['grafana_folder', 'alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 1h
