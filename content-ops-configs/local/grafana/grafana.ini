# 本地 Grafana 配置（免 Docker）：数据/日志/插件落在配置目录，不污染 Grafana 安装
[paths]
provisioning = E:/JavaProjects/Contentops/content-ops-configs/local/grafana/provisioning
data = E:/JavaProjects/Contentops/content-ops-configs/local/grafana/data
logs = E:/JavaProjects/Contentops/content-ops-configs/local/grafana/logs
plugins = E:/JavaProjects/Contentops/content-ops-configs/local/grafana/plugins

[server]
http_port = 3000
