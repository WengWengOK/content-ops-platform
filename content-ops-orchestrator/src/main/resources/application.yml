# ==========================================================================
# Content Ops Orchestrator Service（Phase3 编排器服务，默认端口 8080）
# ==========================================================================
# 说明：渐进拆分阶段（0-1 个月）——直接复用 content-ops-server 全部代码与配置，
#      保证功能 100% 等价于单体。后续 Agent/Tool 迁出后，再逐步缩减依赖包扫描。
# ==========================================================================
server:
  port: ${ORCHESTRATOR_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: content-ops-orchestrator
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# 服务端点（Worker / Tools）地址：第一阶段预留环境变量，后续 Agent 迁出后实际使用
contentops:
  services:
    worker:
      base-url: ${WORKER_BASE_URL:http://127.0.0.1:8081}
      connect-timeout-ms: 5000
      read-timeout-ms: 120000    # LLM 推理慢，单次 120s 兜底
    tools:
      base-url: ${TOOLS_BASE_URL:http://127.0.0.1:8082}
      connect-timeout-ms: 3000
      read-timeout-ms: 30000

# Phase3 服务化拆分模式开关（环境变量 CONTENTOPS_MODE）：
#   monolithic  (默认) = 编排器本地跑 Agent + Tools（Legacy 单体模式，零网络开销）
#   microservice       = Agent 走 HTTP 调 Worker:8081，Tools 部分走 HTTP 调 Tools:8082（真拆分模式）
#   mock               = 全部 Mock 返回（开发测试模式）
# 说明：microservice 模式下，编排器侧 RemoteAgentGateway 激活（替代 LocalAgentGateway），
#       Agent 调用真正从编排器进程迁出到 Worker 进程，实现 LLM I/O 故障域隔离。
#env:
#  CONTENTOPS_MODE: ${CONTENTOPS_MODE:monolithic}
