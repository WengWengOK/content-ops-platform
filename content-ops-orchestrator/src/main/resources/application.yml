# ==========================================================================
# Content Ops Orchestrator Service（Phase3 编排器服务，默认端口 8080）
# ==========================================================================
# 说明：渐进拆分阶段（0-1 个月）——直接复用 content-ops-server 全部代码与配置，
#      保证功能 100% 等价于单体。后续 Agent/Tool 迁出后，再逐步缩减依赖包扫描。
# ==========================================================================
server:
  port: ${ORCHESTRATOR_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: content-ops-orchestrator
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# 服务端点（Worker / Tools）地址：第一阶段预留环境变量，后续 Agent 迁出后实际使用
contentops:
  services:
    worker:
      base-url: ${WORKER_BASE_URL:http://127.0.0.1:8081}
      connect-timeout-ms: 5000
      read-timeout-ms: 120000    # LLM 推理慢，单次 120s 兜底
    tools:
      base-url: ${TOOLS_BASE_URL:http://127.0.0.1:8082}
      connect-timeout-ms: 3000
      read-timeout-ms: 30000
