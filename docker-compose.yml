version: '3.8'

services:
  # === 基础设施 ===
  eureka-server:
    image: springcloud/eureka:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: contentops
      POSTGRES_USER: contentops
      POSTGRES_PASSWORD: contentops123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # === Agent 微服务 ===
  agent-topic:
    build: ./content-ops-agent-topic
    container_name: agent-topic
    depends_on:
      - eureka-server
      - redis
      - kafka
    ports:
      - "8081:8081"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - REDIS_HOST=redis
      - KAFKA_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}

  agent-content:
    build: ./content-ops-agent-content
    container_name: agent-content
    depends_on:
      - eureka-server
      - redis
      - kafka
    ports:
      - "8082:8082"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - REDIS_HOST=redis
      - KAFKA_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}

  agent-image:
    build: ./content-ops-agent-image
    container_name: agent-image
    depends_on:
      - eureka-server
      - redis
      - kafka
    ports:
      - "8083:8083"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - REDIS_HOST=redis
      - KAFKA_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}

  agent-publish:
    build: ./content-ops-agent-publish
    container_name: agent-publish
    depends_on:
      - eureka-server
      - redis
      - kafka
    ports:
      - "8084:8084"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - REDIS_HOST=redis
      - KAFKA_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}

  agent-analysis:
    build: ./content-ops-agent-analysis
    container_name: agent-analysis
    depends_on:
      - eureka-server
      - redis
      - kafka
    ports:
      - "8085:8085"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - REDIS_HOST=redis
      - KAFKA_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}

  agent-optimize:
    build: ./content-ops-agent-optimize
    container_name: agent-optimize
    depends_on:
      - eureka-server
      - redis
      - kafka
    ports:
      - "8086:8086"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - REDIS_HOST=redis
      - KAFKA_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}

  # === 编排器 ===
  orchestrator:
    build: ./content-ops-orchestrator
    container_name: orchestrator
    depends_on:
      - eureka-server
      - redis
      - kafka
      - agent-topic
      - agent-content
      - agent-image
      - agent-publish
      - agent-analysis
      - agent-optimize
    ports:
      - "8080:8080"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - REDIS_HOST=redis
      - KAFKA_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}

volumes:
  redis-data:
  postgres-data:
