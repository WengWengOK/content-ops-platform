version: '3.8'

services:
  # === 基础设施 ===
  eureka-server:
    image: springcloud/eureka:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: contentops
      POSTGRES_USER: contentops
      POSTGRES_PASSWORD: contentops123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # P1: Jaeger 分布式链路追踪
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # P1: Prometheus 指标采集
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docs/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # P1: Grafana 指标可视化
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # === Agent 微服务 ===
  agent-topic:
    build: ./content-ops-agent-topic
    container_name: agent-topic
    depends_on:
      - eureka-server
      - redis
      - kafka
      - jaeger
    ports:
      - "8081:8081"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - REDIS_HOST=redis
      - KAFKA_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

  agent-content:
    build: ./content-ops-agent-content
    container_name: agent-content
    depends_on:
      - eureka-server
      - redis
      - kafka
      - jaeger
    ports:
      - "8082:8082"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - REDIS_HOST=redis
      - KAFKA_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

  agent-image:
    build: ./content-ops-agent-image
    container_name: agent-image
    depends_on:
      - eureka-server
      - redis
      - kafka
      - jaeger
    ports:
      - "8083:8083"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - REDIS_HOST=redis
      - KAFKA_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

  agent-publish:
    build: ./content-ops-agent-publish
    container_name: agent-publish
    depends_on:
      - eureka-server
      - redis
      - kafka
      - jaeger
    ports:
      - "8084:8084"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - REDIS_HOST=redis
      - KAFKA_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

  agent-analysis:
    build: ./content-ops-agent-analysis
    container_name: agent-analysis
    depends_on:
      - eureka-server
      - redis
      - kafka
      - jaeger
    ports:
      - "8085:8085"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - REDIS_HOST=redis
      - KAFKA_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

  agent-optimize:
    build: ./content-ops-agent-optimize
    container_name: agent-optimize
    depends_on:
      - eureka-server
      - redis
      - kafka
      - jaeger
    ports:
      - "8086:8086"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - REDIS_HOST=redis
      - KAFKA_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

  # === 编排器 ===
  orchestrator:
    build: ./content-ops-orchestrator
    container_name: orchestrator
    depends_on:
      - eureka-server
      - redis
      - kafka
      - jaeger
      - prometheus
      - agent-topic
      - agent-content
      - agent-image
      - agent-publish
      - agent-analysis
      - agent-optimize
    ports:
      - "8080:8080"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - REDIS_HOST=redis
      - KAFKA_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

volumes:
  redis-data:
  postgres-data:
